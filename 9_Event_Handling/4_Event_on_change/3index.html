<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin : 0;
            padding : 0;
            font-family :Arial, Helvetica, sans-serif;
            box-sizing : border-box;
        }

        html,
        body{
            width : 100%;
            height : 100%;
        }

        #main{
            display : flex;
            align-items : center;
            justify-content : center;
            width : 100%;
            height : 100%;
            background-color : #222;
        }

        /* we want to accept file but not the way by using input type file  so we will hide it */
        input{
            display : none;
        }

        /* we have added our customized button but want to work that input text=file when we click on this customized button */
        #btn{
            padding : 12px;
            background-color: rgba(5, 249, 50, 0.915);
            color : white;
            border-radius: 5px;
        }

        #btn:hover{
            background-color: green;
        }
    </style>
</head>
<body>
    <div id="main">
        <input id="fileinp" type="file">
        <div id="btn">
            upload File
        </div>
    </div>
    <script src="3event_handler.js"></script>
</body>
</html>
