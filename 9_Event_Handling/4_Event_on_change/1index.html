
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3 id="device">Select u r Device</h3>
    <select>
        <!-- selected makes given element(choose u r device) as default selected option when page loads -->
        <!-- the disabled makes element unusable i.e user cannot select it -->
        <option selected disabled>Choose Your Device</option>
        <option value="samsung">Samsung</option>
        <option value="Redmi">Redmi</option>
        <option value="Oppo">Oppo</option>
        <option value="Iphone">Iphone</option>
    </select>
    <script src="event_handler.js"></script>
</body>
</html>
